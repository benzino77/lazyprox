[project]
name = "lazyprox"
license = "MIT"
version = "0.5.0"
description = "Proxmox TUI"
keywords = [ "proxmox", "terminal", "TUI", "client", "console" ]
readme = "README.md"
authors = [
    { name = "Piotr Antczak", email = "antczak.piotr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "proxmoxer>=2.3.0",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "textual>=8.2.6",
    "textual-plotext>=1.0.1",
]

[project.scripts]
lazyprox = "lazyprox:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.16.3",
    "textual-dev>=1.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "e2e: end-to-end Textual Pilot and snapshot tests",
]
